name: TICKETÉ checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tickete
          POSTGRES_PASSWORD: tickete_local
          POSTGRES_DB: tickete
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickete -d tickete"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/local.txt
      - run: pip install -r requirements/local.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: ruff check .
      - run: black --check .
      - run: python manage.py check
      - run: python manage.py check_services
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: pytest --cov=apps --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    env:
      AUTH_E2E_LIVE: "1"
      DJANGO_SETTINGS_MODULE: config.settings.browser_tests
      DATABASE_URL: postgresql://tickete:tickete_local@127.0.0.1:5432/tickete
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
      TICKETE_ALLOW_DEMO_SEED: "1"
      DEMO_ACCOUNT_PASSWORD: Fictional-CI-Only-Password-581!
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tickete
          POSTGRES_PASSWORD: tickete_local
          POSTGRES_DB: tickete
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickete -d tickete"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../backend/requirements/local.txt
      - run: python ../backend/manage.py migrate --noinput
      - run: python ../backend/manage.py seed_demo_accounts
      - name: Start isolated authentication API
        run: |
          python ../backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/tickete-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/; then exit 0; fi
            sleep 1
          done
          exit 1
      # Avoid retry storms consuming the shared auth IP budget after a failure.
      - run: npm run test:e2e -- --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            frontend/test-results/
