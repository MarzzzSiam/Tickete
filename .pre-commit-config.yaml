repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: black
        name: Black
        entry: python -m black --check --config backend/pyproject.toml
        language: system
        types: [python]
      - id: frontend-lint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
